# 本地同域网关（V5，设计稿 §4.3 / docs/43 §同域网关）：
# 复现生产「同域 path 部署」形态——nginx :8080 反代宿主机 6 个 vite dev server，
# 浏览器只访问 localhost:8080（同 origin），统一登录 cookie 跨 app 漫游可验。
#
# 用法（两个终端）：
#   1. pnpm dev:gateway   # 6 个 app 以 VITE_BASE=/<app>/ 起 dev（端口 5174-5179 钉死，strictPort）
#   2. docker compose up  # 起本网关
# 验证：curl -I http://localhost:8080/admin/ 与 http://localhost:8080/auth/login 均 200
services:
  gateway:
    image: nginx:alpine
    container_name: vv-dev-gateway
    ports:
      - '8080:80'
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # 把 host.docker.internal 钉到 Docker Desktop 的 host-gateway（宿主 IPv4）。
      # 背景：vite dev server 显式绑 0.0.0.0（packages/config server.ts host）供容器可达；
      # 容器经 host.docker.internal（host-gateway 注入的宿主地址）反代宿主机 5174-5179。
      # Linux 原生 docker 该 extra_hosts 同样生效（host-gateway 是 Docker 20.10+ 内置）。
      - host.docker.internal:host-gateway
