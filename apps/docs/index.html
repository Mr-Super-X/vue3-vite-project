<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- docs 无 remAdaptation 插件（h5 布局在 admin），viewport meta 静态声明；
         content 与 admin remAdaptation.ts 的 VIEWPORT_CONTENT 保持一致 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- 首屏占位标题；main.ts 会按 VITE_APP_TITLE 覆盖 -->
    <title>组件示例文档</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
