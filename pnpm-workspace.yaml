# vue 精确钉版（2026-10-28 /autoplan C1 决策）：原钉浮动 'beta' tag——lockfile 缺席时
# （模板消费者复制配置 / pnpm update 重建）新解析出的 beta 构建与验证时不一致，
# 克隆不可复现。钉 3.6.0-beta.17 = 当前 lockfile 验证版本，零行为变更。
# TODO( Mr.Mickey, 2027-01-31 前 )：vue 3.6 稳定线发布后整体回稳定版并删除 overrides
# 全段 + peerDependencyRules.allowAny——升级批次须过 6 app build + e2e 冒烟。
overrides:
  'vue': '3.6.0-beta.17'
  '@vue/compiler-core': '3.6.0-beta.17'
  '@vue/compiler-dom': '3.6.0-beta.17'
  '@vue/compiler-sfc': '3.6.0-beta.17'
  '@vue/compiler-ssr': '3.6.0-beta.17'
  '@vue/compiler-vapor': '3.6.0-beta.17'
  '@vue/reactivity': '3.6.0-beta.17'
  '@vue/runtime-core': '3.6.0-beta.17'
  '@vue/runtime-dom': '3.6.0-beta.17'
  '@vue/runtime-vapor': '3.6.0-beta.17'
  '@vue/server-renderer': '3.6.0-beta.17'
  '@vue/shared': '3.6.0-beta.17'
  '@vue/compat': '3.6.0-beta.17'

peerDependencyRules:
  allowAny:
    - 'vue'

packageExtensions:
  # vxe-table@4.21.x 的 es 产物运行时 import '@vxe-ui/core'（es/ui/index.js），
  # 但包的 package.json 未声明 dependencies/peerDependencies → pnpm 严格 node_modules
  # 下 @vxe-ui/core 根本不进依赖图，vite dev 预构建产物保留裸导入导致 import-analysis 报错。
  # 补声明依赖后 pnpm 会安装 @vxe-ui/core（连带其 dependencies：xe-utils / dom-zindex）
  'vxe-table@*':
    dependencies:
      '@vxe-ui/core': '^4.4.0'

# pnpm 11 项目级 hoisting 配置须写此处（.npmrc 项目级配置不再被读取）。
# 提升 vxe-table 的运行时依赖到根 node_modules，供 vite dev 预构建产物中的裸导入解析
publicHoistPattern:
  - '*@vxe-ui/*'
  - 'xe-utils'
  - 'dom-zindex'
