name: CI

# 触发条件：
#   - push 到 master（主分支每次合入必跑，turbo 全量构建 6 app）
#   - push 到 develop / feature/** / PR 同步到 master、develop（turbo affected，只跑相对 origin/master 有变更的包及其下游）
# 任何条件失败 → 阻止合入
# feature/** 触发：架构审查发现 feature/monorepo 推送不触发 CI 致 lint 回归无声溜入——
# 长生命周期特性分支必须在推送时即过门禁（非仅 PR 时）
on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
    branches: [master, develop]

# 取消同 branch 上的旧 workflow（节省 CI 时间）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + Turbo(Build/Test) + Checks + CheckScriptSpecs + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # turbo affected（--filter=[origin/master]...）需要完整 git 历史做基线对比，
          # 默认 fetch-depth: 1 会让对比退化为「全部变更」
          fetch-depth: 0

      - name: Setup pnpm
        # 不指定 version：由 package.json 的 packageManager 字段单源提供（pnpm@12.11.2）。
        # 双写冲突实测（2026-10-27）：action-setup@v4 检测到 packageManager 与 version
        # 同时存在即报错「Multiple versions of pnpm specified」，Setup pnpm 步骤直接失败
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo local cache
        uses: actions/cache@v4
        with:
          # 统一经 --cache-dir 指向仓库根 .turbo（默认 node_modules/.cache/turbo 不便跨 job 复用）
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-

      - name: Lint
        # lint 保持根全仓一次（turbo 不拆 lint：规则跨包引用，拆包跑反而漏跨包问题）
        run: pnpm lint

      - name: Test local ESLint rules
        # scripts/eslint-rules 非 workspace 包、不经 turbo——node --test 直跑（同 test:gateway 形态）
        run: pnpm test:eslint-rules

      - name: Test check-script specs
        # /autoplan E3（2026-10-28）：check-routes/check-mock-wiring/check-doc-currency 的门禁
        # 判定纯函数表驱动守护——校验器假阳性（静默失效且绿色通过）是最危险的门禁失效模式
        run: pnpm test:check-scripts

      - name: Build + Test (master 全量)
        # 仅 master push 全量（合入即发布候选，与 deploy.yml 同口径）。
        # 顺序强约束：turbo run build 内部 = build-only（unplugin 生成 auto-imports.d.ts /
        # components.d.ts 声明）→ type-check:full（--force 全量门禁），干净 checkout 下
        # 类型检查依赖 build 先生成声明，故不单独拆 type-check step；
        # test 任务 dependsOn ^build（turbo.json），拓扑序由 turbo 保证。
        # showroom 分级（/autoplan C6，2026-10-28）：test 排除 docs/big/h5 三个 showroom
        # app（测试是 ^build 依赖链的大头耗时；PR affected 模式仍覆盖其变更，
        # 浏览器人工验收兜底）。**build 保留全量**——deploy.yml 在 master push 时
        # build:pages 六应用聚合发 Pages，showroom 的构建/类型错误必须由本网拦截
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          pnpm exec turbo run build --cache-dir=.turbo
          pnpm exec turbo run test "--filter=!@vv-app/docs" "--filter=!@vv-app/big" "--filter=!@vv-app/h5" --cache-dir=.turbo

      - name: Build + Test (affected)
        # PR / develop push：affected 只构建相对 origin/master 有变更的包及其依赖下游，
        # 未变更 app 命中 turbo 缓存或跳过（节省 CI 时间）
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        run: pnpm exec turbo run build test "--filter=[origin/master]..." --cache-dir=.turbo

      - name: Coverage threshold gate（admin 渐进基线）
        # 测试审计（2026-10-26）#3：admin 覆盖率阈值 50/48/45/50 此前仅本地生效，
        # CI 从不跑 coverage——阈值形同虚设。接入后低于基线的变更直接红。
        # admin 口径（根 test:coverage → apps/admin vitest --coverage）；单 worker + 复用
        # 上一步 turbo 缓存的构建产物，增量耗时可控（实测约 1-2 分钟）
        run: pnpm test:coverage

      - name: Check routes consistency
        # 校验 RouteName 联合类型 + 实际 routes/*.ts + whitelist 三者一致（monorepo 版脚本，多包兼容）
        run: pnpm check:routes

      - name: Check alias consistency
        # 校验各 app tsconfig.app.json paths 与 @vv/config createAppAliases 单一来源一致
        # （架构审查：CLAUDE.md 承诺「CI 阻断」但 ci.yml 原未接入——补挂兑现承诺）
        run: pnpm check:aliases

      - name: Check doc currency
        # 校验 docs 硬数据（13 项：字段数/Props/行数/demo 数等）与代码一致，防文档漂移
        # （架构审查：同承诺「CI 阻断」未接入——补挂）
        run: pnpm check:doc-currency

      - name: Check mock wiring
        # 校验 @vv/mock 双接线一致（dev index.ts 聚合 vs prod mockProdServer.ts 模块清单）
        # + MOCK_PERMISSIONS 权限码单源——消除历史上「注释约定手工同步」的漂移风险
        # （架构审查健壮性项：全库最现实的 dev/prod 行为分叉风险点）
        run: pnpm check:mock-wiring

      - name: Cache Playwright browsers
        # e2e 入 CI（/autoplan T-2）：chromium 浏览器目录缓存（key 随 lockfile 失效——
        # 版本升级时自动重装）；系统库依赖走 GitHub ubuntu 镜像预装，不进缓存
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm test:e2e:install

      - name: E2E (Playwright)
        # projects 按注册表派生（admin/docs/h5/big），webServer 自起 dev:local（本地菜单
        # + mock 冷启动可直跑）；gateway project 探测可达性自跳过（不硬依赖网关）。
        # 硬守护：关键用户流程（面板/五态/页签守恒）红即阻断
        run: pnpm test:e2e

      - name: Upload build artifact
        # 仅 master 全量构建后保留产物供调试（PR affected 无完整 dist 可传）；
        # 6 app 产物分目录在 apps/<app>/dist/，deploy.yml 独立构建发布、不消费本 artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: apps/*/dist/
          retention-days: 7
