name: CI

# 触发条件：
#   - push 到 master（主分支每次合入必跑）
#   - PR 同步到 master 时（PR 合入前必跑）
# 任何条件失败 → 阻止合入
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# 取消同 branch 上的旧 workflow（节省 CI 时间）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + TypeCheck + Test + CheckRoutes + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        # 顺序强约束：build 必须先于任何 type-check——unplugin 在 build 时生成
        # auto-imports.d.ts / components.d.ts（gitignore 不入库），CI 干净 checkout 下
        # 任何 type-check 都依赖这些生成文件（本地有 dev 残留所以不显）。
        # pnpm build 内部 = build-only（生成声明）+ type-check:full（--force 全量），
        # 类型检查由本步骤覆盖，不再单独跑 type-check step（避免二次全量）
        run: pnpm build

      - name: Unit tests
        run: pnpm test --run

      - name: Check routes consistency
        # 校验 RouteName 联合类型 + 实际 routes/*.ts + whitelist 三者一致
        run: pnpm check:routes

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
