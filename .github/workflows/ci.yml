name: CI

# 触发条件：
#   - push 到 main（主分支每次合入必跑）
#   - PR 同步到 main 时（PR 合入前必跑）
# 任何条件失败 → 阻止合入
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同 branch 上的旧 workflow（节省 CI 时间）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint + TypeCheck + Test + CheckRoutes + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check (full)
        # --force 强制重建 .tsbuildinfo 防缓存陈旧
        run: pnpm type-check:full

      - name: Unit tests
        run: pnpm test --run

      - name: Check routes consistency
        # 校验 RouteName 联合类型 + 实际 routes/*.ts + whitelist 三者一致
        run: pnpm check:routes

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
