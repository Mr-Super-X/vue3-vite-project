# 职责：构建 gh-pages 产物并部署（不跑 lint/test/check:routes——同次 push 的 ci.yml 已做完整门禁，本 workflow 只构建 + 发布）
name: Deploy to GitHub Pages

# 触发条件：push 到 master 自动部署（仅 master 发布；develop 只过 CI 不发布，见 job 级 if 守卫）+ 手动兜底
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read # checkout 需要；public 仓库匿名读可运行，显式声明与官方模板对齐
  pages: write
  id-token: write

# 取消同 branch 上的旧 workflow（与 ci.yml 同策略）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_BASE: /vue3-vite-project/ # vue-router basename（src/router/config.ts 消费）
  VITE_HISTORY_MODE: hash # gh-pages 无 SPA fallback，hash 模式刷新/深层链接不 404
  VITE_MENU_SOURCE: local # 纯静态托管无后端，菜单走本地静态路由
  VITE_USE_MOCK: 'true' # 生产构建客户端 mock 挂接开关（src/main.ts PROD && 判定 → createProdMockServer 浏览器端 XHR 劫持）
  VITE_DEMO_NO_AUTH: 'true' # 演示模式：守卫跳过登录/权限校验（gh-pages 纯演示站无敏感数据，prod 版 auth mock 提供演示账号）

jobs:
  deploy:
    name: Build + Deploy
    # ref 守卫：workflow_dispatch 手动触发可选任意含本文件的分支，
    # 无守卫会把 develop 等未发布分支构建推到 Pages（违背 master 即线上单一真相源）
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # 顺序强约束：必须先于 type-check——unplugin 在 build 时生成 auto-imports.d.ts /
        # components.d.ts（两者 gitignore 不入库），CI 干净 checkout 下 type-check 依赖
        # 这些生成文件（本地有 dev 残留所以不显）；与 package.json build 脚本
        # 「build-only 先行生成」的既定顺序对齐
        # vite 静态资源 base 复用 env.VITE_BASE 单源（与 vue-router basename 同源，避免两处维护分叉）
        run: pnpm build-only --base=${{ env.VITE_BASE }}

      - name: Type check (full)
        # --force 强制重建 .tsbuildinfo 防缓存陈旧（在 build 之后跑，类型声明文件已生成）
        run: pnpm type-check:full

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
