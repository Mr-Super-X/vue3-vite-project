# 职责：构建 gh-pages 产物并部署（不跑 lint/test/check:routes——同次 push 的 ci.yml 已做完整门禁，本 workflow 只构建 + 发布）
name: Deploy to GitHub Pages

# 触发条件：push 到 master 自动部署（仅 master 发布；develop 只过 CI 不发布，见 job 级 if 守卫）
# + gh-pages 分支（2026-10-27 预览通道）：把 feature 分支内容推到 gh-pages 即可触发构建发布，
# 用于「未合入 master 前先在线验收」；Environment 白名单（Settings → Environments →
# github-pages → Deployment branches）需同步放行 gh-pages 分支
on:
  push:
    branches: [master, gh-pages]
  workflow_dispatch:

permissions:
  contents: read # checkout 需要；public 仓库匿名读可运行，显式声明与官方模板对齐
  pages: write
  id-token: write

# 取消同 branch 上的旧 workflow（与 ci.yml 同策略）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # gh-pages 演示四开关（语义同 ci.yml 前身单应用版）：纯静态托管无后端，菜单走本地 + 浏览器端 mock + 免登录演示。
  # VITE_BASE 有意不在此声明：多应用聚合后 base 不再是单源——scripts/build-pages.ts 内
  # REPO_PREFIX（默认 /vue3-vite-project）按 app 注入 /vue3-vite-project/<app>/；
  # 自定义域部署改脚本内 REPO_PREFIX 为 '/' 即可，本处声明会造成「改了却不生效」的误导。
  # 四开关经 process.env 透传，作为 build-pages.ts spawn 注入之外的兜底默认值（脚本内显式覆盖）。
  VITE_HISTORY_MODE: hash # gh-pages 无 SPA fallback，hash 模式刷新/深层链接不 404
  VITE_MENU_SOURCE: local # 纯静态托管无后端，菜单走本地静态路由
  VITE_USE_MOCK: 'true' # 生产构建客户端 mock 挂接开关（src/main.ts PROD && 判定 → createProdMockServer 浏览器端 XHR 劫持）
  VITE_DEMO_NO_AUTH: 'true' # 演示模式：守卫跳过登录/权限校验（gh-pages 纯演示站无敏感数据，prod 版 auth mock 提供演示账号）
  # 版本检测 buildId 注入（/autoplan Round 2 F6+P3-13）：git sha 使产物可追溯；
  # 拼 run_attempt 消「同 commit 重跑（retry）产生相同 buildId → 运行时不提示刷新」
  VITE_BUILD_ID: ${{ github.sha }}-${{ github.run_attempt }}

jobs:
  deploy:
    name: Build + Deploy
    # ref 守卫：workflow_dispatch 手动触发可选任意含本文件的分支，
    # 无守卫会把 develop 等未发布分支构建推到 Pages（违背 master 即线上单一真相源）；
    # gh-pages 为例外预览通道（2026-10-27）：该分支的 push 同样放行部署
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 不指定 version：由 package.json 的 packageManager 字段单源提供（pnpm@12.11.2）。
        # 双写冲突实测（2026-10-27）：action-setup@v4 检测到 packageManager 与 version
        # 同时存在即报错「Multiple versions of pnpm specified」，Setup pnpm 步骤直接失败
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (6 app 聚合)
        # scripts/build-pages.ts：自动发现 apps/* 下含 vite.config.ts 的应用，
        # 逐个 spawn 注入演示五开关（base 按 REPO_PREFIX/<app>/ 注入）跑 build-only，
        # 产物聚合到根 dist/<app>/ 并生成落地导航页 dist/index.html。
        # env 经 spawn 注入不依赖 shell 展开（Windows Git Bash 无 MSYS2_ARG_CONV_EXCL 坑）。
        # 不再单独跑 type-check：同次 push 的 ci.yml（turbo build 内含 build-only → type-check:full）
        # 已做全量门禁（顺序约束：unplugin 声明文件由 build 生成）
        run: pnpm build:pages

      - name: Upload Pages artifact
        # 聚合产物：dist/ 下 6 个 app 子目录 + 落地页 index.html，整目录发布
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
