# 本地同域网关 nginx 配置（docker-compose gateway 服务以 :ro 挂载到 conf.d/default.conf）。
#
# 反代宿主机 6 个 vite dev server（host.docker.internal:5174-5179，端口与
# packages/config/src/server.ts portOffset 严格对齐：admin 5174 / docs 5175 /
# portal 5176 / h5 5177 / big 5178 / auth 5179）。两个关键语义：
#   1. proxy_pass 不带 URI 部分 → 保留原始路径前缀转发（/admin/xxx → 5174/admin/xxx），
#      与各 app dev 以 VITE_BASE=/<app>/ 启动的 base 前缀严格对齐——若改写前缀 vite dev 404。
#   2. Upgrade / Connection 头透传（server 级统一设置）→ vite HMR websocket 经网关可用。
# 生产同域部署（各 app 静态产物 alias + try_files）语义见 docs/43。
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  # 上游用宿主 IPv4 字面量（192.168.65.254 = Docker Desktop host-gateway）直连 vite，
  # 不走域名解析——Windows 下 host.docker.internal 有 IPv4+IPv6 双 /etc/hosts 记录，
  # nginx 变量化 proxy_pass 会优先不可达 IPv6（::254）；且宿主 IP 非 DNS 服务器，
  # resolver 查域名会 Server failure。vite 绑 0.0.0.0（packages/config server.host），
  # 容器经宿主 IPv4 直达。若 Docker Desktop 宿主 IP 漂移（罕见），改本文件 6 处 IP 即可。
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /admin/ {
    proxy_pass http://192.168.65.254:5174;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs/ {
    proxy_pass http://192.168.65.254:5175;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /portal/ {
    proxy_pass http://192.168.65.254:5176;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /h5/ {
    proxy_pass http://192.168.65.254:5177;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /big/ {
    proxy_pass http://192.168.65.254:5178;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    proxy_pass http://192.168.65.254:5179;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    return 302 /portal/;
  }
}
